# ─────────────────────────────────────────────────────────────────────────────
#  Contribution snake animation
#
#  WHERE THIS FILE GOES:
#      shrish2406/shrish2406  →  .github/workflows/snake.yml
#
#  WHAT IT DOES:
#      Every midnight UTC it redraws the "snake eating my commit graph" SVGs and
#      pushes them to a branch called `output`. The README reads them from:
#        https://raw.githubusercontent.com/shrish2406/shrish2406/output/github-snake.svg
#        https://raw.githubusercontent.com/shrish2406/shrish2406/output/github-snake-dark.svg
#
#  FIRST RUN: GitHub → your repo → Actions → "Generate Snake Animation" →
#             "Run workflow" (do this once, since a scheduled job can take hours
#             to fire the first time).
# ─────────────────────────────────────────────────────────────────────────────

name: Generate Snake Animation

on:
  # Re-draw the snake every day at 00:00 UTC.
  schedule:
    - cron: "0 0 * * *"

  # Allow a manual run from the Actions tab.
  workflow_dispatch:

  # Also re-draw whenever you push to the profile repo.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: shrish2406
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push the SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
